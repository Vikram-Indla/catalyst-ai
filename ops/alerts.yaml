# Alerting rules over the metrics the ops port exposes (docs/04-ledgers/slos.md).
# Prometheus rule format: the one an OpenTelemetry collector, Prometheus, Mimir or Grafana Cloud
# all read without translation. Every rule names its runbook; tools/checks/alerts refuses a rule
# whose runbook does not exist or carries no heading naming the alert, and tools/checks/latency
# refuses a latency rule whose threshold is not the declared budget of what it selects.
groups:
  - name: catalyst-ai-capabilities
    interval: 30s
    rules:
      - alert: CapabilityErrorBudgetBurn
        expr: |
          sum by (operation) (rate(catalyst_ai_http_requests_total{status="5xx"}[1h]))
            / sum by (operation) (rate(catalyst_ai_http_requests_total[1h])) > 0.01
        for: 15m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.operation }} is burning its availability budget"
          runbook: docs/06-runbooks/capabilities.md
      - alert: CapabilityLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (operation, le) (
              rate(catalyst_ai_http_request_duration_seconds_bucket{operation=~"(improve_story|unfurl|interpret_query)[.].*"}[1h])
            )
          ) > 4
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.operation }} p95 is over its 4 s budget"
          runbook: docs/06-runbooks/capabilities.md
      - alert: CapabilityLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (operation, le) (
              rate(catalyst_ai_http_request_duration_seconds_bucket{operation=~"translate[.].*"}[1h])
            )
          ) > 6
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.operation }} p95 is over its 6 s budget"
          runbook: docs/06-runbooks/capabilities.md
      - alert: CapabilityLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (operation, le) (
              rate(catalyst_ai_http_request_duration_seconds_bucket{operation=~"(generate_children|summarize|brief)[.].*"}[1h])
            )
          ) > 8
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.operation }} p95 is over its 8 s budget"
          runbook: docs/06-runbooks/capabilities.md
      - alert: CapabilityLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (operation, le) (
              rate(catalyst_ai_http_request_duration_seconds_bucket{operation=~"(propose_workflow|release_notes)[.].*"}[1h])
            )
          ) > 10
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.operation }} p95 is over its 10 s budget"
          runbook: docs/06-runbooks/capabilities.md
      - alert: CapabilityLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (operation, le) (
              rate(catalyst_ai_http_request_duration_seconds_bucket{operation=~"(assistant|generate_tests|post_mortem)[.].*"}[1h])
            )
          ) > 12
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.operation }} p95 is over its 12 s budget"
          runbook: docs/06-runbooks/capabilities.md
      - alert: CapabilityLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (operation, le) (
              rate(catalyst_ai_http_request_duration_seconds_bucket{operation=~"documents[.](ask|generate|ingest)"}[1h])
            )
          ) > 15
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.operation }} p95 is over its 15 s budget"
          runbook: docs/06-runbooks/capabilities.md
      - alert: RetrievalLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (operation, le) (
              rate(catalyst_ai_http_request_duration_seconds_bucket{operation=~"(search|index)[.].*"}[1h])
            )
          ) > 0.8
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.operation }} p95 is over its 800 ms retrieval budget"
          runbook: docs/06-runbooks/capabilities.md
      - alert: OutputRefusalsHigh
        expr: |
          sum(rate(catalyst_ai_errors_total{code=~"ai.output.*"}[6h]))
            / sum(rate(catalyst_ai_http_requests_total{operation!="unknown"}[6h])) > 0.01
        for: 30m
        labels:
          severity: ticket
        annotations:
          summary: "more than one answer in a hundred is refused as invalid or unsafe"
          runbook: docs/06-runbooks/eval-drift.md
      - alert: CacheHitRateLow
        expr: |
          sum(rate(catalyst_ai_cache_lookups_total{result="hit"}[6h]))
            / sum(rate(catalyst_ai_cache_lookups_total[6h])) < 0.2
            and sum(rate(catalyst_ai_cache_lookups_total[6h])) > 0.05
        for: 1h
        labels:
          severity: ticket
        annotations:
          summary: "the cache is serving almost nothing; a key or a TTL moved"
          runbook: docs/06-runbooks/capabilities.md

  - name: catalyst-ai-provider
    interval: 30s
    rules:
      - alert: ProviderFailing
        expr: |
          sum by (model) (
            rate(catalyst_ai_provider_calls_total{outcome=~"ai.provider.*"}[1h])
          ) / sum by (model) (rate(catalyst_ai_provider_calls_total[1h])) > 0.05
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.model }} is failing more than one call in twenty"
          runbook: docs/06-runbooks/provider-outage.md
      - alert: ProviderLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (capability, le) (
              rate(catalyst_ai_provider_call_duration_seconds_bucket{capability=~"improve-story|unfurl|interpret-query"}[1h])
            )
          ) > 4
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.capability }} waits on the provider past its 4 s budget"
          runbook: docs/06-runbooks/provider-outage.md
      - alert: ProviderLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (capability, le) (
              rate(catalyst_ai_provider_call_duration_seconds_bucket{capability=~"translate"}[1h])
            )
          ) > 6
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.capability }} waits on the provider past its 6 s budget"
          runbook: docs/06-runbooks/provider-outage.md
      - alert: ProviderLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (capability, le) (
              rate(catalyst_ai_provider_call_duration_seconds_bucket{capability=~"generate-children|summarize|brief"}[1h])
            )
          ) > 8
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.capability }} waits on the provider past its 8 s budget"
          runbook: docs/06-runbooks/provider-outage.md
      - alert: ProviderLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (capability, le) (
              rate(catalyst_ai_provider_call_duration_seconds_bucket{capability=~"propose-workflow|release-notes"}[1h])
            )
          ) > 10
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.capability }} waits on the provider past its 10 s budget"
          runbook: docs/06-runbooks/provider-outage.md
      - alert: ProviderLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (capability, le) (
              rate(catalyst_ai_provider_call_duration_seconds_bucket{capability=~"assistant|generate-tests|post-mortem"}[1h])
            )
          ) > 12
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.capability }} waits on the provider past its 12 s budget"
          runbook: docs/06-runbooks/provider-outage.md
      - alert: ProviderLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (capability, le) (
              rate(catalyst_ai_provider_call_duration_seconds_bucket{capability=~"documents"}[1h])
            )
          ) > 15
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.capability }} waits on the provider past its 15 s budget"
          runbook: docs/06-runbooks/provider-outage.md
      - alert: ProviderLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (capability, le) (
              rate(catalyst_ai_provider_call_duration_seconds_bucket{capability=~"search"}[1h])
            )
          ) > 0.8
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.capability }} waits on the provider past its 800 ms budget"
          runbook: docs/06-runbooks/provider-outage.md
  - name: catalyst-ai-tenants
    interval: 1m
    rules:
      - alert: TenantBudgetExhausted
        expr: sum by (organization, capability) (rate(catalyst_ai_budget_refused_total[1h])) > 0.01
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: >-
            organisation {{ $labels.organization }} is refused on its daily budget
            for {{ $labels.capability }}
          runbook: docs/06-runbooks/budget-exhaustion.md

  - name: catalyst-ai-jobs
    interval: 30s
    rules:
      - alert: JobQueueBacklog
        expr: max by (state) (catalyst_ai_jobs{state="queued"}) > 50
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "the job queue is not draining"
          runbook: docs/06-runbooks/job-backlog.md
      - alert: JobQuarantined
        expr: increase(catalyst_ai_job_quarantined_total[1h]) > 0
        for: 0m
        labels:
          severity: page
        annotations:
          summary: "a job row failed its stored proof — {{ $labels.reason }}"
          runbook: docs/06-runbooks/job-quarantine.md

  - name: catalyst-ai-origin
    interval: 30s
    rules:
      - alert: OriginForged
        expr: increase(catalyst_ai_origin_refused_total{reason="bad_signature"}[1h]) > 0
        for: 0m
        labels:
          severity: page
        annotations:
          summary: "a request carried a forged envelope under a known key id"
          runbook: docs/06-runbooks/origin-refusals.md
      - alert: OriginRefusalsHigh
        expr: sum(rate(catalyst_ai_origin_refused_total[1h])) > 0.2
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "refused origins are steady — a clock, a rotation or something that is not the backend"
          runbook: docs/06-runbooks/origin-refusals.md

  - name: catalyst-ai-storage
    interval: 30s
    rules:
      - alert: IndexUnavailable
        expr: sum(rate(catalyst_ai_errors_total{code="ai.index.unavailable"}[15m])) > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "the retrieval index is not answering"
          runbook: docs/06-runbooks/index-unavailable.md
      - alert: OriginUnverifiable
        expr: sum(rate(catalyst_ai_errors_total{code="auth.origin.unverifiable"}[15m])) > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "the replay store cannot answer; the door is failing closed"
          runbook: docs/06-runbooks/replay-store-down.md
