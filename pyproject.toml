[project]
name = "catalyst-ai"
version = "0.1.0"
description = "Catalyst One AI service — capabilities behind one contract for the backend"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "starlette==1.3.1",
  "uvicorn==0.40.0",
  "pydantic==2.12.5",
  "pydantic-settings==2.14.2",
  "httpx==0.28.1",
  "asyncpg==0.31.0",
  "pgvector==0.4.2",
  "pypdf>=6.19.0",
  "defusedxml>=0.7.1",
]

[project.scripts]
catalyst-ai = "catalyst_ai.cli:main"

[dependency-groups]
dev = [
  "ruff==0.15.4",
  "mypy==1.20.0",
  "import-linter==2.9",
  "pytest==9.0.3",
  "pytest-asyncio==1.3.0",
  "pytest-socket==0.7.0",
  "pytest-cov==7.0.0",
  "hypothesis==6.150.0",
  "coverage==7.13.4",
  "pip-audit==2.9.0",
  "pyyaml==6.0.3",
  "types-pyyaml==6.0.12.20250915",
  "asyncpg-stubs==0.31.0",
  "testcontainers==4.14.0",
]

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catalyst_ai"]
