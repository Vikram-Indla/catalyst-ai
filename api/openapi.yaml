      - mode
      - text
      title: TranslateRequest
      type: object
    TranslateResponse:
      additionalProperties: false
      description: The translation, the languages, whether the structure survived, the confidence.
      properties:
        capability_version:
          title: Capability Version
          type: string
        confidence:
          maximum: 1.0
          minimum: 0.0
          title: Confidence
          type: number
        detected_language:
          title: Detected Language
          type: string
        eval_set_version:
          title: Eval Set Version
          type: string
        model:
          title: Model
          type: string
        prompt_version:
          title: Prompt Version
          type: string
        request_id:
          title: Request Id
          type: string
        structure_preserved:
          title: Structure Preserved
