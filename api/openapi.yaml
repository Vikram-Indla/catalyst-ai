          - passage
          - item
          - page
          title: Kind
          type: string
        marker:
          minimum: 1.0
          title: Marker
          type: integer
        source_id:
          title: Source Id
          type: string
      required:
      - marker
      - kind
      - source_id
      title: TurnSource
      type: object
    UnfurlRequest:
      additionalProperties: false
      description: What the backend holds about the thing a member linked.
      properties:
        capability_version:
          data_class: PUBLIC
          description: The version the caller was built against
          pattern: ^\d+\.\d+\.\d+$
          title: Capability Version
          type: string
        id:
          data_class: INTERNAL
          description: The backend's id
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,63}$
          title: Id
          type: string
        kind:
          data_class: PUBLIC
          description: A work item or a page
          enum:
          - item
          - page
          title: Kind
          type: string
        language:
          anyOf:
          - maxLength: 16
            pattern: ^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$
            type: string
          - type: 'null'
          data_class: PUBLIC
          description: BCP 47 tag of the card; else the text's
          title: Language
        organization_id:
          data_class: INTERNAL
          description: The tenant every row is scoped by
          format: uuid
          title: Organization Id
          type: string
        status:
          anyOf:
          - maxLength: 64
            type: string
          - type: 'null'
          data_class: INTERNAL
          description: An item's status
          title: Status
        text:
          anyOf:
          - maxLength: 20000
            type: string
          - type: 'null'
          data_class: CONFIDENTIAL
          description: The description or the page's text
          title: Text
        title:
          data_class: CONFIDENTIAL
          description: The title as stored
          maxLength: 500
          minLength: 1
          title: Title
          type: string
      required:
      - organization_id
      - capability_version
      - kind
      - id
      - title
      title: UnfurlRequest
      type: object
    UnfurlResponse:
      additionalProperties: false
      description: 'The card: the title echoed, a one-line summary, a few facts — nothing not in the input.'
      properties:
        capability_version:
          title: Capability Version
          type: string
        confidence:
          maximum: 1.0
          minimum: 0.0
          title: Confidence
          type: number
        eval_set_version:
          title: Eval Set Version
          type: string
        facts:
          items:
            $ref: '#/components/schemas/catalyst_ai__contract__unfurl__Fact'
          maxItems: 6
          title: Facts
          type: array
        model:
          title: Model
          type: string
        prompt_version:
          title: Prompt Version
          type: string
        request_id:
          title: Request Id
          type: string
        summary:
          maxLength: 300
          title: Summary
          type: string
        title:
          maxLength: 500
          title: Title
          type: string
        usage:
          $ref: '#/components/schemas/Usage'
      required:
      - capability_version
      - prompt_version
      - model
      - eval_set_version
      - usage
      - request_id
      - title
      - summary
      - facts
      - confidence
      title: UnfurlResponse
      type: object
    Usage:
      additionalProperties: false
      description: Tokens, cost and latency of one call; cost in micro-dollars, latency in milliseconds.
      properties:
        cache_hit:
          title: Cache Hit
          type: boolean
        cost_micros:
          minimum: 0.0
          title: Cost Micros
          type: integer
        input_tokens:
          minimum: 0.0
          title: Input Tokens
          type: integer
        latency_ms:
          minimum: 0.0
          title: Latency Ms
          type: integer
        output_tokens:
          minimum: 0.0
          title: Output Tokens
          type: integer
      required:
      - input_tokens
      - output_tokens
      - cost_micros
      - latency_ms
      - cache_hit
      title: Usage
      type: object
    UsageFrame:
      additionalProperties: false
      description: The turn's tokens, cost and latency; sent once, before the terminal frame.
      properties:
        kind:
          const: usage
          default: usage
          title: Kind
          type: string
        usage:
          $ref: '#/components/schemas/Usage'
      required:
      - usage
      title: UsageFrame
      type: object
    Window:
      additionalProperties: false
      description: The span a standup or digest covers; items outside it are left out.
      properties:
        from_at:
          format: date-time
          title: From At
          type: string
        to_at:
          format: date-time
          title: To At
          type: string
      required:
      - from_at
      - to_at
      title: Window
      type: object
    catalyst_ai__contract__post_mortem__Fact:
      additionalProperties: false
      description: One line of the reconstructed timeline, traced to the entry it restates.
      properties:
        source_id:
          maxLength: 64
          minLength: 1
          title: Source Id
          type: string
        text:
          maxLength: 600
          minLength: 1
          title: Text
          type: string
      required:
      - source_id
      - text
      title: Fact
      type: object
    catalyst_ai__contract__propose_workflow__StatusCategory:
      description: The three categories every engine status falls into.
      enum:
      - todo
      - in_progress
      - done
      title: StatusCategory
      type: string
    catalyst_ai__contract__release_notes__StatusCategory:
      description: Where a change stands, in the three categories the engine knows.
      enum:
      - todo
      - in_progress
      - done
      title: StatusCategory
      type: string
    catalyst_ai__contract__unfurl__Fact:
      additionalProperties: false
      description: One labelled value the card shows, taken from the supplied text.
      properties:
        label:
          maxLength: 40
          minLength: 1
          title: Label
          type: string
        value:
          maxLength: 120
          minLength: 1
          title: Value
          type: string
      required:
      - label
      - value
      title: Fact
      type: object
  securitySchemes:
    CatalystEnvelope:
      description: 'Proof of origin, signed by the backend: `<claims>.<signature>` where claims is the
        base64url of a JSON object {iss: backend, aud: catalyst-ai, org, cap, sub, iat, exp (at most 60
        s after iat), jti, kid, bh (hex SHA-256 of the request body), job_exp?} and signature is the base64url
        of the Ed25519 signature over the ASCII bytes of the claims segment, by the private key `kid`
        names. The service holds public keys only.'
      scheme: Catalyst-Envelope
      type: http
