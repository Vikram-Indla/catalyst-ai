components:
  schemas:
    ActionItem:
      additionalProperties: false
      description: One proposed action, a candidate the backend may turn into work, with its evidence.
      properties:
        confidence:
          maximum: 1.0
          minimum: 0.0
          title: Confidence
          type: number
        evidence:
          items:
            type: string
          maxItems: 30
          title: Evidence
          type: array
        text:
          maxLength: 600
          minLength: 1
          title: Text
          type: string
      required:
      - text
      - evidence
      - confidence
      title: ActionItem
      type: object
    Area:
      description: What a case covers.
      enum:
      - happy
      - negative
      - boundary
      - security
      - performance
      - integration
      title: Area
      type: string
    AskRequest:
      additionalProperties: false
      description: A question over one space; the answer comes only from what the space's index holds.
      properties:
        capability_version:
          data_class: PUBLIC
          description: The version the caller was built against
          pattern: ^\d+\.\d+\.\d+$
          title: Capability Version
          type: string
        k:
          data_class: PUBLIC
          default: 8
          description: Chunks to read
          maximum: 20.0
          minimum: 1.0
          title: K
          type: integer
        kinds:
          data_class: PUBLIC
          description: Only documents of these kinds; empty = all
          items:
            type: string
          maxItems: 20
          title: Kinds
          type: array
        language:
          anyOf:
          - maxLength: 16
            pattern: ^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$
            type: string
          - type: 'null'
          data_class: PUBLIC
          description: BCP 47 tag; absent follows the question's
          title: Language
        organization_id:
          data_class: INTERNAL
          description: The tenant every row is scoped by
          format: uuid
          title: Organization Id
          type: string
        question:
          data_class: CONFIDENTIAL
          description: The member's question
          maxLength: 2000
          minLength: 1
          title: Question
          type: string
        space_id:
          data_class: INTERNAL
          description: The space asked
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,63}$
          title: Space Id
          type: string
      required:
      - organization_id
      - capability_version
      - space_id
      - question
      title: AskRequest
      type: object
    AskResponse:
      additionalProperties: false
      description: The answer with a citation behind every claim, or not found.
      properties:
        answer:
          maxLength: 8000
          title: Answer
          type: string
        capability_version:
          title: Capability Version
          type: string
        citations:
          items:
            $ref: '#/components/schemas/Citation'
          maxItems: 40
          title: Citations
          type: array
        confidence:
          maximum: 1.0
          minimum: 0.0
          title: Confidence
          type: number
        eval_set_version:
          title: Eval Set Version
          type: string
        model:
          title: Model
          type: string
        not_found:
          title: Not Found
          type: boolean
        prompt_version:
          title: Prompt Version
          type: string
        request_id:
          title: Request Id
          type: string
        usage:
          $ref: '#/components/schemas/Usage'
      required:
      - capability_version
      - prompt_version
      - model
      - eval_set_version
      - usage
      - request_id
      - answer
      - citations
      - not_found
      - confidence
      title: AskResponse
      type: object
    Audience:
      description: 'Who reads the notes: the team, or the customers of the product.'
      enum:
      - internal
      - customer
      title: Audience
      type: string
    Candidate:
      additionalProperties: false
      description: One proposed child; the backend decides whether it becomes an item.
      properties:
        acceptance_criteria:
          items:
            type: string
          maxItems: 20
          title: Acceptance Criteria
          type: array
        confidence:
          maximum: 1.0
          minimum: 0.0
          title: Confidence
          type: number
        description:
          maxLength: 20000
          title: Description
          type: string
        duplicate_of:
          anyOf:
          - maxLength: 500
            type: string
          - type: 'null'
          title: Duplicate Of
        title:
          maxLength: 500
          minLength: 1
          title: Title
          type: string
        type:
          maxLength: 64
          minLength: 1
          title: Type
          type: string
      required:
      - type
      - title
      - description
      - confidence
      title: Candidate
      type: object
    Change:
      additionalProperties: false
      description: 'One change in the release: the id every note must cite, its kind, its text, its state.'
      properties:
        description:
          anyOf:
          - maxLength: 4000
            type: string
          - type: 'null'
          title: Description
        id:
          maxLength: 64
          minLength: 1
          title: Id
          type: string
        key:
          anyOf:
          - maxLength: 32
            type: string
          - type: 'null'
          title: Key
        kind:
          maxLength: 64
          pattern: ^[a-z][a-z0-9_]{0,63}$
          title: Kind
          type: string
        participant:
          anyOf:
          - pattern: ^p[0-9]{1,4}$
            type: string
          - type: 'null'
          title: Participant
        status_category:
          $ref: '#/components/schemas/catalyst_ai__contract__release_notes__StatusCategory'
          default: done
        title:
          maxLength: 500
          minLength: 1
          title: Title
          type: string
      required:
      - id
      - kind
      - title
      title: Change
      type: object
    ChatSection:
      additionalProperties: false
      description: 'One section of a channel summary: a fixed heading and the lines under it.'
      properties:
        heading:
          title: Heading
          type: string
        lines:
          items:
            type: string
          maxItems: 12
          title: Lines
          type: array
      required:
      - heading
      - lines
      title: ChatSection
      type: object
    Citation:
      additionalProperties: false
      description: 'One chunk an answer rests on: its id, its document, where in it, the words quoted.'
      properties:
        chunk_id:
          title: Chunk Id
          type: string
        document_id:
          title: Document Id
          type: string
        heading_path:
          items:
            type: string
          title: Heading Path
          type: array
        position:
          minimum: 0.0
          title: Position
          type: integer
        quote:
          maxLength: 300
          title: Quote
          type: string
      required:
      - chunk_id
      - document_id
      - position
      - heading_path
      - quote
      title: Citation
      type: object
    CitationFrame:
      additionalProperties: false
      description: One source the reply rests on, sent once it is known.
      properties:
        kind:
          const: citation
          default: citation
          title: Kind
          type: string
        source:
          $ref: '#/components/schemas/TurnSource'
      required:
      - source
      title: CitationFrame
      type: object
    Context:
      additionalProperties: false
      description: 'Everything the reply may know: chosen, scoped and classified by the backend.'
      properties:
        items:
          items:
            $ref: '#/components/schemas/ContextItem'
          maxItems: 50
          title: Items
          type: array
        pages:
          items:
            $ref: '#/components/schemas/ContextPage'
          maxItems: 5
          title: Pages
          type: array
        spaces:
          items:
            $ref: '#/components/schemas/ContextSpace'
          maxItems: 10
          title: Spaces
          type: array
      title: Context
      type: object
    ContextItem:
      additionalProperties: false
      description: A work item the backend decided this member may see, as facts — never a query result.
      properties:
        id:
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,63}$
          title: Id
          type: string
        key:
          anyOf:
          - maxLength: 64
            type: string
          - type: 'null'
          title: Key
        kind:
          pattern: ^[a-z][a-z0-9_]{0,63}$
          title: Kind
          type: string
        status:
          anyOf:
          - maxLength: 64
            type: string
          - type: 'null'
          title: Status
        summary:
          anyOf:
          - maxLength: 2000
            type: string
          - type: 'null'
          title: Summary
        title:
          maxLength: 500
          minLength: 1
          title: Title
          type: string
      required:
      - id
      - kind
      - title
      title: ContextItem
      type: object
    ContextPage:
      additionalProperties: false
      description: A page's text the backend supplies whole; shown as one numbered source.
      properties:
        id:
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,63}$
          title: Id
          type: string
        text:
          maxLength: 20000
          minLength: 1
          title: Text
          type: string
        title:
          anyOf:
          - maxLength: 500
            type: string
          - type: 'null'
          title: Title
      required:
      - id
      - text
      title: ContextPage
      type: object
    ContextSpace:
      additionalProperties: false
      description: A space the reply may read through the documents index; membership is the backend's.
      properties:
        space_id:
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,63}$
          title: Space Id
          type: string
        title:
          anyOf:
          - maxLength: 500
            type: string
          - type: 'null'
          title: Title
      required:
      - space_id
      title: ContextSpace
      type: object
    CoveredRange:
      additionalProperties: false
      description: 'Which items the summary rests on: the first and last ids and how many.'
      properties:
        count:
          minimum: 0.0
          title: Count
          type: integer
        first_id:
          anyOf:
          - type: string
          - type: 'null'
          title: First Id
        last_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Id
      required:
      - first_id
      - last_id
      - count
      title: CoveredRange
      type: object
    Criterion:
      additionalProperties: false
      description: One acceptance criterion with the id a case cites.
      properties:
        id:
          maxLength: 64
          minLength: 1
          title: Id
          type: string
        text:
          maxLength: 600
          minLength: 1
          title: Text
          type: string
      required:
      - id
      - text
      title: Criterion
      type: object
    DataTable:
      additionalProperties: false
      description: One table of test data, traced to the cases that use it.
      properties:
        columns:
          items:
            type: string
          maxItems: 8
          minItems: 1
          title: Columns
          type: array
        covers:
          items:
            type: string
          maxItems: 50
          minItems: 1
          title: Covers
          type: array
        name:
          maxLength: 500
          minLength: 1
          title: Name
          type: string
        rows:
          items:
            items:
              type: string
            type: array
          maxItems: 20
          title: Rows
          type: array
      required:
      - name
      - columns
      - rows
      - covers
      title: DataTable
      type: object
    DeltaFrame:
      additionalProperties: false
      description: A piece of the reply's prose, in order; the joined deltas are the reply of `done`.
      properties:
        kind:
          const: delta
          default: delta
          title: Kind
          type: string
        text:
          maxLength: 4000
          title: Text
          type: string
      required:
      - text
      title: DeltaFrame
      type: object
    DigestGroup:
      additionalProperties: false
      description: What changed for one kind in the window; the count is the backend's, echoed.
      properties:
        changes:
          items:
            type: string
          maxItems: 12
          title: Changes
          type: array
        count:
          minimum: 0.0
          title: Count
          type: integer
        kind:
          title: Kind
          type: string
      required:
      - kind
      - count
      - changes
      title: DigestGroup
      type: object
    DocumentFormat:
      description: The formats the parsers accept; anything else is `document_unsupported`.
      enum:
      - docx
      - pptx
      - pdf
      - markdown
      - text
      title: DocumentFormat
      type: string
    DoneFrame:
      additionalProperties: false
      description: 'The terminal frame of a stream that succeeded: the whole validated response.'
      properties:
        kind:
          const: done
          default: done
          title: Kind
          type: string
        result:
          $ref: '#/components/schemas/TurnResponse'
      required:
      - result
      title: DoneFrame
      type: object
    DraftRequest:
      additionalProperties: false
      description: A brief and the sources it may draw on; nothing outside them enters the draft.
      properties:
        brief:
          data_class: CONFIDENTIAL
          description: What the document should say
          maxLength: 4000
          minLength: 1
          title: Brief
          type: string
        capability_version:
          data_class: PUBLIC
          description: The version the caller was built against
          pattern: ^\d+\.\d+\.\d+$
          title: Capability Version
          type: string
        language:
          anyOf:
          - maxLength: 16
            pattern: ^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$
            type: string
          - type: 'null'
          data_class: PUBLIC
          description: BCP 47 tag; absent follows the brief's
          title: Language
        organization_id:
          data_class: INTERNAL
          description: The tenant every row is scoped by
          format: uuid
          title: Organization Id
          type: string
        sources:
          data_class: CONFIDENTIAL
          description: The texts with the ids sections cite
          items:
            $ref: '#/components/schemas/Source'
          maxItems: 40
          minItems: 1
          title: Sources
          type: array
        target_words:
          data_class: PUBLIC
          default: 600
          description: The length wanted, in words
          maximum: 2000.0
          minimum: 100.0
          title: Target Words
          type: integer
      required:
      - organization_id
      - capability_version
      - brief
      - sources
      title: DraftRequest
      type: object
    DraftResponse:
      additionalProperties: false
      description: A draft whose every section cites, or nothing with its reason.
      properties:
        capability_version:
          title: Capability Version
          type: string
        confidence:
          maximum: 1.0
          minimum: 0.0
          title: Confidence
          type: number
        empty_reason:
          anyOf:
          - const: sources_insufficient
            type: string
          - type: 'null'
          title: Empty Reason
        eval_set_version:
          title: Eval Set Version
          type: string
        model:
          title: Model
          type: string
        prompt_version:
          title: Prompt Version
          type: string
        request_id:
          title: Request Id
          type: string
        sections:
          items:
            $ref: '#/components/schemas/DraftSection'
          maxItems: 30
          title: Sections
          type: array
        title:
          maxLength: 500
          title: Title
          type: string
        usage:
          $ref: '#/components/schemas/Usage'
      required:
      - capability_version
      - prompt_version
      - model
      - eval_set_version
      - usage
      - request_id
      - title
      - sections
      - empty_reason
      - confidence
      title: DraftResponse
      type: object
    DraftSection:
      additionalProperties: false
      description: One section of a draft with the sources it rests on.
      properties:
        heading:
          maxLength: 500
          minLength: 1
          title: Heading
          type: string
        sources:
          items:
            type: string
          maxItems: 40
          minItems: 1
          title: Sources
          type: array
        text:
          maxLength: 8000
          minLength: 1
          title: Text
          type: string
      required:
      - heading
      - text
      - sources
      title: DraftSection
      type: object
    Entry:
      additionalProperties: false
      description: One line of the notes, traced to the change it came from.
      properties:
        source_id:
          maxLength: 64
          minLength: 1
          title: Source Id
          type: string
        text:
          maxLength: 600
          minLength: 1
          title: Text
          type: string
      required:
      - source_id
      - text
      title: Entry
      type: object
    ErrorBody:
      additionalProperties: false
      description: Return the error object inside the envelope.
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        details:
          items:
            $ref: '#/components/schemas/ErrorDetail'
          title: Details
          type: array
        message:
          title: Message
          type: string
        retry_after_ms:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Retry After Ms
      required:
      - code
      - message
      title: ErrorBody
      type: object
    ErrorCode:
      description: Every code a response may carry; the ledger is generated from this enum.
      title: ErrorCode
      type: string
      x-extensible-enum:
      - auth.origin.invalid
      - auth.origin.unverifiable
      - validation.invalid_input
      - ai.contract.version_mismatch
      - ai.capability.unknown
      - ai.capability.disabled
      - ai.input.rejected
      - ai.input.too_large
      - ai.budget.exceeded
      - ai.provider.unavailable
      - ai.provider.timeout
      - ai.provider.rejected
      - ai.provider.quota
      - ai.output.invalid
      - ai.output.unsafe
      - ai.index.document_too_large
      - ai.index.unavailable
      - internal.error
    ErrorDetail:
      additionalProperties: false
      description: One field-level detail of a validation or rejection error.
      properties:
        code:
          title: Code
          type: string
        field:
          title: Field
          type: string
        message:
          title: Message
          type: string
      required:
      - field
      - code
      - message
      title: ErrorDetail
      type: object
    ErrorEnvelope:
      additionalProperties: false
      description: Return the one error shape every operation returns, including 401, 404, 429 and 500.
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
        request_id:
          title: Request Id
          type: string
      required:
      - error
      - request_id
      title: ErrorEnvelope
      type: object
    ErrorFrame:
      additionalProperties: false
      description: 'The terminal frame of a stream that failed: the same envelope every operation returns.'
      properties:
        error:
          $ref: '#/components/schemas/ErrorEnvelope'
        kind:
          const: error
          default: error
          title: Kind
          type: string
      required:
      - error
      title: ErrorFrame
      type: object
    Event:
      additionalProperties: false
      description: 'One timeline entry: the id a fact must cite, when, who (a token), what.'
      properties:
        at:
          format: date-time
          title: At
          type: string
        id:
          maxLength: 64
          minLength: 1
          title: Id
          type: string
        participant:
          anyOf:
          - pattern: ^p[0-9]{1,4}$
            type: string
          - type: 'null'
          title: Participant
        text:
          maxLength: 4000
          minLength: 1
          title: Text
          type: string
      required:
      - id
      - at
      - text
      title: Event
      type: object
    ExistingCase:
      additionalProperties: false
      description: One test case the artefacts are built from, with the id a table cites.
      properties:
        id:
          maxLength: 64
          minLength: 1
          title: Id
          type: string
        objective:
          anyOf:
          - maxLength: 600
            type: string
          - type: 'null'
          title: Objective
        steps:
          items:
            $ref: '#/components/schemas/Step'
          maxItems: 12
          title: Steps
          type: array
        title:
          maxLength: 500
          minLength: 1
          title: Title
          type: string
      required:
      - id
      - title
      title: ExistingCase
      type: object
    ExistingStatus:
      additionalProperties: false
      description: A status of the scheme to extend, under either spelling; `name` and `order` are read.
      properties:
        category:
          $ref: '#/components/schemas/catalyst_ai__contract__propose_workflow__StatusCategory'
        initial:
          default: false
          title: Initial
          type: boolean
        key:
          maxLength: 64
          pattern: ^[a-z][a-z0-9_]{0,63}$
          title: Key
          type: string
        label:
          anyOf:
          - maxLength: 120
            minLength: 1
            type: string
          - type: 'null'
          deprecated: true
          description: Read the engine's word instead; removed at 1.2.0
          title: Label
        name:
          anyOf:
          - maxLength: 120
            minLength: 1
            type: string
          - type: 'null'
          title: Name
        order:
          anyOf:
          - maximum: 25.0
            minimum: 0.0
            type: integer
          - type: 'null'
          title: Order
        sort_order:
          anyOf:
          - maximum: 25.0
            minimum: 0.0
            type: integer
          - type: 'null'
          deprecated: true
          description: Read the engine's word instead; removed at 1.2.0
          title: Sort Order
        terminal:
          default: false
          title: Terminal
          type: boolean
      required:
      - key
      - category
      title: ExistingStatus
      type: object
    Factor:
      additionalProperties: false
      description: One contributing factor — analysis — with the entries it rests on.
      properties:
        evidence:
          items:
            type: string
          maxItems: 30
          minItems: 1
          title: Evidence
          type: array
        text:
          maxLength: 600
          minLength: 1
          title: Text
          type: string
      required:
      - text
      - evidence
      title: Factor
      type: object
    GenerateChildrenRequest:
      additionalProperties: false
      description: The parent, its context, the hierarchy as data, the siblings, and the bounds.
      properties:
        capability_version:
          data_class: PUBLIC
          description: The version the caller was built against
          pattern: ^\d+\.\d+\.\d+$
          title: Capability Version
          type: string
        child_level:
          anyOf:
          - maxLength: 64
            type: string
          - type: 'null'
          data_class: INTERNAL
          description: The wanted level; absent means the next one down
          title: Child Level
        focus_hint:
          anyOf:
          - maxLength: 500
            type: string
          - type: 'null'
          data_class: CONFIDENTIAL
          description: What the member asked to focus on
          title: Focus Hint
        hierarchy:
          data_class: INTERNAL
          description: The organisation's ordered levels, top first
          items:
            type: string
          maxItems: 12
          minItems: 2
          title: Hierarchy
          type: array
        language:
          anyOf:
          - maxLength: 16
            pattern: ^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$
            type: string
          - type: 'null'
          data_class: PUBLIC
          description: BCP 47 tag of the output; absent preserves the input's
          title: Language
        max_items:
          data_class: PUBLIC
          default: 7
          description: The most candidates to return
          maximum: 20.0
          minimum: 1.0
          title: Max Items
          type: integer
        organization_id:
          data_class: INTERNAL
          description: The tenant every row is scoped by
          format: uuid
          title: Organization Id
          type: string
        parent_description:
          data_class: CONFIDENTIAL
          description: The parent's description
          maxLength: 20000
          title: Parent Description
          type: string
        parent_level:
          data_class: INTERNAL
          description: The parent's level, one of hierarchy
          maxLength: 64
          minLength: 1
          title: Parent Level
          type: string
        parent_title:
          data_class: CONFIDENTIAL
          description: The parent's title
          maxLength: 500
          title: Parent Title
          type: string
        siblings:
          data_class: CONFIDENTIAL
          description: Existing children at the wanted level
          items:
            $ref: '#/components/schemas/Sibling'
          maxItems: 100
          title: Siblings
          type: array
        source_texts:
          data_class: CONFIDENTIAL
          description: Extracted text the backend attaches
          items:
            type: string
          maxItems: 10
          title: Source Texts
          type: array
        target:
          $ref: '#/components/schemas/GenerateTarget'
          data_class: PUBLIC
          description: Which prompt section and defaults apply
      required:
      - organization_id
      - capability_version
      - target
      - hierarchy
      - parent_level
      - parent_title
      - parent_description
      title: GenerateChildrenRequest
      type: object
    GenerateChildrenResponse:
      additionalProperties: false
      description: Candidates, or an empty list with the reason; never an item written anywhere.
      properties:
        candidates:
          items:
            $ref: '#/components/schemas/Candidate'
          title: Candidates
          type: array
        capability_version:
          title: Capability Version
          type: string
        confidence:
          anyOf:
          - maximum: 1.0
            minimum: 0.0
            type: number
          - type: 'null'
          title: Confidence
        empty_reason:
          anyOf:
          - enum:
            - parent_too_vague
            - siblings_cover_it
            - nothing_at_this_level
            type: string
          - type: 'null'
          title: Empty Reason
        eval_set_version:
          title: Eval Set Version
          type: string
        index_consulted:
          default: false
          title: Index Consulted
