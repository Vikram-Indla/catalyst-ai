          - maxLength: 16
            pattern: ^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$
            type: string
          - type: 'null'
          data_class: PUBLIC
          description: BCP 47 tag of the reply; else the thread's
          title: Language
        organization_id:
          data_class: INTERNAL
          description: The tenant every row is scoped by
          format: uuid
          title: Organization Id
          type: string
        summary:
          anyOf:
          - maxLength: 2000
            type: string
          - type: 'null'
          data_class: CONFIDENTIAL
