          title: Summary
      required:
      - organization_id
      - capability_version
      - history
      title: TurnRequest
      type: object
    TurnResponse:
      additionalProperties: false
      description: The reply with what it rests on, or nothing found; `[n]` in the reply names `sources`.
      properties:
        capability_version:
          title: Capability Version
          type: string
        confidence:
          maximum: 1.0
          minimum: 0.0
          title: Confidence
          type: number
        eval_set_version:
          title: Eval Set Version
          type: string
        model:
          title: Model
          type: string
        not_found:
          title: Not Found
