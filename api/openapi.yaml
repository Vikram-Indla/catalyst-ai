      - prompt_version
      - model
      - eval_set_version
      - usage
      - request_id
      - translated_text
      - detected_language
      - target_language
      - structure_preserved
      - confidence
      title: TranslateResponse
      type: object
    Turn:
      additionalProperties: false
      description: One message of the thread the backend keeps; the service remembers nothing between
        calls.
      properties:
        role:
          enum:
          - user
          - assistant
          title: Role
          type: string
        text:
          maxLength: 4000
          minLength: 1
          title: Text
          type: string
      required:
      - role
      - text
      title: Turn
      type: object
    TurnRequest:
      additionalProperties: false
      description: The thread (bounded), the backend's digest of what fell off it, and the context.
      properties:
        capability_version:
          data_class: PUBLIC
          description: The version the caller was built against
          pattern: ^\d+\.\d+\.\d+$
          title: Capability Version
          type: string
        context:
          $ref: '#/components/schemas/Context'
          data_class: CONFIDENTIAL
          description: What this member may see; decided and scoped by the backend
        history:
          data_class: CONFIDENTIAL
          description: The thread, oldest first
