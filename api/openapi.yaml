        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateChildrenResponse'
          description: Successful Response
          x-example: see the contract tests
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Generate Children
      tags:
      - capabilities
      x-capability: generate-children
      x-capability-version: 1.0.0
      x-error-codes:
      - ai.contract.version_mismatch
      - ai.capability.disabled
      - ai.input.rejected
