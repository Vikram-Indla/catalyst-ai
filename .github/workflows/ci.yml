name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    container:
      image: python:3.12.14-slim
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: catalyst_ai
          POSTGRES_PASSWORD: catalyst_ai
          POSTGRES_DB: catalyst_ai
        options: >-
          --health-cmd "pg_isready -U catalyst_ai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CATALYST_AI_EVAL_DATABASE_URL: postgresql://catalyst_ai:catalyst_ai@postgres:5432/catalyst_ai
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends make git curl ca-certificates && pip install uv==0.12.16
      - uses: actions/checkout@v4
      - run: make tools
      - run: make hooks
      - run: make verify
