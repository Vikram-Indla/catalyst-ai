[mypy]
python_version = 3.12
strict = True
warn_unreachable = True
warn_unused_ignores = True
strict_equality = True
mypy_path = src
namespace_packages = True
explicit_package_bases = True
exclude = (?x)(
    ^tools/checks/selftest/plants/
    | ^tests/fixtures/
    | ^evals/
    | ^\.tools/
  )

[mypy-pgvector.*]
ignore_missing_imports = True

[mypy-testcontainers.*]
ignore_missing_imports = True

[mypy-pytest_socket.*]
ignore_missing_imports = True

[mypy-defusedxml.*]
ignore_missing_imports = True
